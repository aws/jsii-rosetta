# ~~ Generated by projen. To modify, edit .projenrc.ts and run "yarn projen".

name: build
on:
  merge_group: {}
  pull_request: {}
  workflow_dispatch: {}
  push:
    branches:
      - main
      - maintenance/*
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      self-mutation-needed: ${{ steps.self-mutation.outputs.needed }}
    env:
      CI: "true"
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
      - name: Enable corepack
        id: enable_corepack
        run: corepack enable
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: yarn
      - name: Cache build outputs
        id: cache_build_outputs
        if: github.event_name == 'pull_request'
        uses: actions/cache@v4
        with:
          key: build-outputs-${{ hashFiles('tsconfig.json', 'build-tools/**/*.ts', 'src/**/*.ts', 'package.json', 'yarn.lock') }}
          path: |-
            tsconfig.tsbuildinfo
            lib/**/*
          restore-keys: build-outputs-
      - name: Install dependencies
        id: install_dependencies
        run: yarn install --immutable
      - name: compile
        id: compile
        run: npx projen && npx projen pre-compile && npx projen compile && npx projen post-compile
      - name: test
        id: test
        run: npx projen test
      - name: Find mutations
        id: self-mutation
        run: |-
          git add .
          git diff --staged --patch --exit-code > .repo.patch || echo "needed=true" >> $GITHUB_OUTPUT
      - name: Upload patch
        id: upload_patch
        if: steps.self-mutation.outputs.needed
        uses: actions/upload-artifact@v7
        with:
          name: .repo.patch
          path: .repo.patch
          overwrite: true
          include-hidden-files: true
      - name: Fail if self-mutation is needed
        id: fail_if_self-mutation_is_needed
        if: steps.self-mutation.outputs.needed
        run: |-
          echo "::error::Files were changed during build (see build log). If this was triggered from a fork, you will need to update your branch."
          cat .repo.patch
          exit 1
      - name: Upload artifact
        id: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |-
            ${{ github.workspace }}
            !${{ github.workspace }}/node_modules
            !${{ github.workspace }}/fixtures/node_modules
          overwrite: true
          include-hidden-files: true
  self-mutation:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CI: "true"
    if: always() && (github.event_name == 'pull_request') && needs.build.outputs.self-mutation-needed && (github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.PROJEN_GITHUB_TOKEN }}
      - name: Download patch
        id: download_patch
        uses: actions/download-artifact@v8
        with:
          name: .repo.patch
          path: ${{ runner.temp }}
      - name: Apply patch
        id: apply_patch
        run: '[ -s ${{ runner.temp }}/.repo.patch ] && git apply ${{ runner.temp }}/.repo.patch || echo "Empty patch. Skipping."'
      - name: Set git identity
        id: set_git_identity
        run: |-
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
      - name: Push changes
        id: push_changes
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |-
          git add .
          git commit -s -m "chore: self-mutation"
          git push origin "HEAD:$HEAD_REF"
  matrix-test:
    name: test (node ${{ matrix.node-version }})
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    env:
      CI: "true"
    if: success()
    steps:
      - name: Download artifact
        id: download_artifact
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: ${{ github.workspace }}
      - name: Enable corepack
        id: enable_corepack
        run: corepack enable
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - name: Install dependencies
        id: install_dependencies
        run: yarn install --immutable
      - name: Re-run post-compile
        id: re-run_post-compile
        run: npx projen post-compile
      - name: Test
        id: test
        run: npx projen test
      - name: Assert clean working directory
        id: assert_clean_working_directory
        run: git diff --staged --exit-code
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x
          - 22.x
          - 24.x
  matrix-clear:
    name: Unit Tests
    needs: matrix-test
    runs-on: ubuntu-latest
    permissions: {}
    env:
      CI: "true"
    if: always()
    steps:
      - name: Build result
        id: build_result
        run: echo ${{needs.matrix-test.result}}
      - name: Set status based on matrix build
        id: set_status_based_on_matrix_build
        if: ${{ needs.matrix-test.result != 'success' }}
        run: exit 1
  package:
    name: package
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    env:
      CI: "true"
    steps:
      - name: Download artifact
        id: download_artifact
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: ${{ github.workspace }}
      - name: Enable corepack
        id: enable_corepack
        run: corepack enable
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: yarn
      - name: Install dependencies
        id: install_dependencies
        run: yarn install --immutable
      - name: Package
        id: package
        run: npx projen package
      - name: Upload artifact
        id: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: ${{ github.workspace }}/dist
          overwrite: true
          include-hidden-files: true
